name: release
run-name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  tests:
    uses: ./.github/workflows/test.yaml
    secrets: inherit

  publish-release:
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "json-schema-validator ${{ github.ref_name }}"
          prerelease: false
          draft: false
          generate_release_notes: true
